  <style>
    /* 커스텀 스크롤바 숨김 처리 (모바일 앱 뷰 최적화) */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* 패브릭 텍스처 미세 패턴 */
    .fabric-texture {
      background-image: radial-gradient(rgba(27, 48, 34, 0.06) 1px, transparent 0);
      background-size: 12px 12px;
    }

    /* 부드러운 화면 전환 애니메이션 */
    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-screen {
      animation: fadeSlideUp 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* 리본 물결 그림자 */
    .ribbon-shadow {
      box-shadow: 0 8px 20px -4px rgba(27, 48, 34, 0.18);
    }

    // 2. 커스텀 SVG 일러스트 헬퍼 (외부 이미지 깨짐 방지 및 감성 표현)
    // =========================================================================
    function getGarmentSVG() {
      return `
        <svg viewBox="0 0 280 200" class="w-full h-full">
          <rect width="280" height="200" fill="#DED7CC"/>
          <!-- 접힌 헌 데님 자켓 & 린넨 셔츠 일러스트 -->

            <!-- 카라 -->
            <path d="M75 10 L95 34 L115 10" fill="none" stroke="#2B2B2B" stroke-width="2"/>
            <path d="M75 10 L68 28 L95 34 L122 28 L115 10" fill="#768CA3" stroke="#2B2B2B" stroke-width="1.5"/>

            <circle cx="95" cy="74" r="3.5" fill="#E9B44C" stroke="#2B2B2B" stroke-width="1"/>
            <circle cx="95" cy="96" r="3.5" fill="#E9B44C" stroke="#2B2B2B" stroke-width="1"/>
            <!-- 주머니 및 봉제선 -->

            <!-- 아래 겹쳐진 체크 린넨 원단 -->
            <path d="M25 118 Q95 105 165 118 L172 142 Q95 132 18 142 Z" fill="#EAE3D5" stroke="#2B2B2B" stroke-width="1.8"/>
            <path d="M35 128 Q95 118 155 128" fill="none" stroke="#D46A4C" stroke-width="1.5" stroke-dasharray="4 3"/>
          </g>
          <text x="140" y="186" text-anchor="middle" fill="#2B2B2B" font-size="11" font-weight="600" opacity="0.65">BEFORE · 옷장 속 잠든 데님 자켓 & 셔츠</text>
        </svg>
      `;
    }

    function getWreathSVG(type = 'denim') {
      const palette = type === 'workwear'
        ? { c1: '#1B3022', c2: '#D46A4C', c3: '#E9B44C', bg: '#EAE4DA' }
        : type === 'quilt'
        ? { c1: '#8E839B', c2: '#E4B7B2', c3: '#F7F4EF', bg: '#EAE4DA' }
        : { c1: '#3F5A73', c2: '#D46A4C', c3: '#E9B44C', bg: '#EAE4DA' };

      return `
        <svg viewBox="0 0 280 200" class="w-full h-full">
          <rect width="280" height="200" fill="${palette.bg}"/>
          <!-- 리스 베이스 링 -->
          <circle cx="140" cy="92" r="56" fill="none" stroke="#1B3022" stroke-width="14" opacity="0.88"/>
          <circle cx="140" cy="92" r="56" fill="none" stroke="#8FA895" stroke-width="3" stroke-dasharray="6 4"/>
          
          <!-- 업사이클링 패브릭 꽃송이들 -->
          <!-- 꽃 1 (좌상단 데님/메인 원단 꽃) -->
          <g transform="translate(92, 62)">
            <circle cx="0" cy="-10" r="11" fill="${palette.c1}"/>
            <circle cx="10" cy="-3" r="11" fill="${palette.c1}"/>
            <circle cx="6" cy="9" r="11" fill="${palette.c1}"/>
            <circle cx="-6" cy="9" r="11" fill="${palette.c1}"/>
            <circle cx="-10" cy="-3" r="11" fill="${palette.c1}"/>
            <!-- 보존된 단추 꽃술 -->
            <circle cx="0" cy="0" r="6" fill="#E9B44C" stroke="#2B2B2B" stroke-width="1.2"/>
            <circle cx="-2" cy="-1.5" r="0.8" fill="#2B2B2B"/>
            <circle cx="2" cy="-1.5" r="0.8" fill="#2B2B2B"/>
            <circle cx="-2" cy="1.5" r="0.8" fill="#2B2B2B"/>
            <circle cx="2" cy="1.5" r="0.8" fill="#2B2B2B"/>
          </g>

          <!-- 꽃 2 (우상단 테라코타 로즈) -->
          <g transform="translate(185, 65)">
            <circle cx="0" cy="-9" r="10" fill="${palette.c2}"/>
            <circle cx="9" cy="-2" r="10" fill="${palette.c2}"/>
            <circle cx="5" cy="8" r="10" fill="${palette.c2}"/>
            <circle cx="-5" cy="8" r="10" fill="${palette.c2}"/>
            <circle cx="-9" cy="-2" r="10" fill="${palette.c2}"/>
            <circle cx="0" cy="0" r="5" fill="#F7F4EF"/>
          </g>

          <!-- 꽃 3 (하단 중앙 메인 빅플라워) -->
          <g transform="translate(140, 144)">
            <circle cx="0" cy="-12" r="13" fill="${palette.c2}"/>
            <circle cx="12" cy="-4" r="13" fill="${palette.c1}"/>
            <circle cx="8" cy="10" r="13" fill="${palette.c2}"/>
            <circle cx="-8" cy="10" r="13" fill="${palette.c1}"/>
            <circle cx="-12" cy="-4" r="13" fill="${palette.c2}"/>
            <circle cx="0" cy="0" r="6.5" fill="${palette.c3}" stroke="#2B2B2B" stroke-width="1.2"/>
          </g>

          <!-- 꽃 4 & 5 보조 꽃 -->
          <circle cx="86" cy="112" r="12" fill="${palette.c3}" stroke="#1B3022" stroke-width="1.5"/>
          <circle cx="86" cy="112" r="4" fill="${palette.c1}"/>
          <circle cx="192" cy="112" r="12" fill="${palette.c1}"/>

          <text x="140" y="186" text-anchor="middle" fill="#1B3022" font-size="11" font-weight="700">AFTER · 단추와 원단 결을 살린 패브릭 리스</text>
        </svg>
      `;

    function getShapeIconSVG(shapeName) {
      if (shapeName.includes('3단')) {
        return `<svg class="w-10 h-10 text-forest" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2">

          <circle cx="33" cy="17" r="4" fill="#E9B44C"/>
          <circle cx="24" cy="37" r="5" fill="#D46A4C"/>
        </svg>`;
      } else {
        return `<svg class="w-10 h-10 text-forest" viewBox="0 0 48 48" fill="none">
          <path d="M15 30H33L30 40H18L15 30Z" fill="#8E839B"/>

    let toastTimer = null;
    function showToast(msg) {
      const box = document.getElementById('toast-box');
      const text = document.getElementById('toast-text');
      text.textContent = msg;
      box.classList.remove('opacity-0', '-translate-y-2');
      box.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        box.classList.remove('opacity-100', 'translate-y-0');
        box.classList.add('opacity-0', '-translate-y-2');
      }, 2400);
    }

    function calculatePickupDeadline(eventDateStr) {
      if (!eventDateStr) return '행사일 9일 전까지';
      const d = new Date(eventDateStr);
      if (isNaN(d.getTime())) return '행사일 9일 전까지';
      d.setDate(d.getDate() - 9);
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      return `${d.getMonth() + 1}월 ${d.getDate()}일(${days[d.getDay()]})`;
    }

      appState.currentTab = tabName;
      // 하단 탭 스타일 업데이트
      document.querySelectorAll('.nav-btn').forEach(btn => {
        if (btn.dataset.tab === tabName) {
          btn.classList.remove('text-charcoal/45');
          btn.classList.add('text-forest');
        } else {
          btn.classList.remove('text-forest');
          btn.classList.add('text-charcoal/45');
        }
      });

      const viewport = document.getElementById('app-viewport');
      viewport.scrollTop = 0;

      if (tabName === 'home') renderHome();
      else if (tabName === 'create') renderCreate();
      else if (tabName === 'myloop') renderMyLoop();
      else if (tabName === 'my') renderMyPage();
    }

    // 제작 플로우 인터랙션 핸들러
    function updateForm(key, val) {
      appState.orderForm[key] = val;
      renderCreate();
    }

    function selectCreateShape(name, price) {
      appState.orderForm.shape = name;
      appState.orderForm.shapePrice = price;
      renderCreate();
    }

    function changeGarmentCount(delta) {
      const next = Math.max(1, Math.min(15, appState.orderForm.garmentCount + delta));
      appState.orderForm.garmentCount = next;
      renderCreate();
    }

    function toggleDetail(detailName) {
      const list = appState.orderForm.details;
      const idx = list.indexOf(detailName);
      if (idx > -1) {
        if (list.length > 1) list.splice(idx, 1);
        else showToast('최소 1개 이상의 제작 방식을 선택해 주세요.');
      } else {
        list.push(detailName);
      }
      renderCreate();
    }

    function updateRibbonLive(key, val) {
      appState.orderForm[key] = val;
      const targetId = key === 'ribbonMsg' ? 'preview-ribbon-msg' : 'preview-ribbon-sender';
      const el = document.getElementById(targetId);
      if (el) el.textContent = val || (key === 'ribbonMsg' ? '축하 문구를 입력하세요' : '보내는 분 성함');
    }

    function fillSampleRibbon() {
      appState.orderForm.ribbonMsg = '당신의 빛나는 새로운 출발을 응원합니다';
      appState.orderForm.ribbonSender = '오랜 친구들이 마음을 담아';
      renderCreate();
      showToast('추천 리본 문구가 적용되었습니다.');
    }

    function updateStoryTag(val) {
      appState.orderForm.storyTag = val;
      const counter = document.getElementById('story-char-count');
      if (counter) counter.textContent = `${val.length}/60자`;
    }

    function selectRemakeOption(name, price) {
      appState.orderForm.remakeGoods = name;
      appState.orderForm.remakePrice = price;
      renderCreate();
    }

    function prevCreateStep() {
      if (appState.createStep > 1) {
        appState.createStep--;
        renderCreate();
      } else {
        switchTab('home');
      }
    }

    function nextCreateStep() {
      if (appState.createStep < 5) {
        appState.createStep++;
        document.getElementById('app-viewport').scrollTop = 0;
        renderCreate();
      }
    }

    function submitOrder() {
      const f = appState.orderForm;
      appState.customCreatedOrder = {
        id: 'ORD-20261113-NEW',
        badge: f.purpose,
        badgeColor: 'bg-terracotta text-white',
        title: `${f.purpose} 맞춤 ${f.shape}`,
        shape: f.shape,
        garments: `${f.garmentType} ${f.garmentCount}점`,
        details: f.details,
        ribbonMsg: f.ribbonMsg,
        ribbonSender: f.ribbonSender,
        story: `“${f.storyTag}”`,
        remake: f.remakeGoods,
        date: f.eventDate,
        pickupMethod: f.pickupMethod,
        flowerType: 'denim'
      };
      appState.selectedTrackingOrder = 'custom';
      showToast('주문이 완료되었습니다! 실시간 트래킹으로 이동합니다.');
      switchTab('myloop');
    }

          <div class="p-4 rounded-3xl bg-forest text-oatmeal shadow-md relative overflow-hidden">
            <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-mustard text-forest text-[11px] font-bold mb-2.5">
              <span class="w-1.5 h-1.5 rounded-full bg-forest animate-ping"></span>
              <span>${activeData.statusBadge}</span>
            </div>
            <h2 class="text-[16px] font-bold leading-snug">${activeData.title}</h2>
            <p class="mt-1.5 text-[12px] text-oatmeal/80 leading-relaxed">${activeData.statusSummary}</p>

            <!-- 작업 공정 미리보기 일러스트 -->
            <div class="mt-3.5 h-[135px] rounded-2xl overflow-hidden border border-oatmeal/15">
              ${getWreathSVG('denim')}
            </div>

            <!-- QR 디지털 스토리 카드 미리보기 버튼 -->
            <button onclick="openQRArchive(${isCustomSelected ? -1 : 0})" class="mt-3.5 w-full py-2.5 rounded-xl bg-oatmeal/15 hover:bg-oatmeal/25 text-oatmeal text-[12px] font-semibold flex items-center justify-center gap-1.5 transition">
              <svg class="w-4 h-4 text-mustard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
              <span>화환에 달릴 QR 스토리 카드 미리보기</span>
            </button>
          </div>

          <!-- Vertical Timeline Stepper -->
          <div class="mt-5 p-4 rounded-3xl bg-white border border-forest/10">
            <h3 class="text-[14px] font-bold text-forest mb-4">순환 제작 타임라인</h3>
            <div class="space-y-4">
              ${activeData.steps.map((st, idx) => {
                const isLast = idx === activeData.steps.length - 1;
                const dotStyle = st.state === 'done'
                  ? 'bg-forest text-oatmeal'
                  : st.state === 'current'
                  ? 'bg-terracotta text-white ring-4 ring-terracotta/20'
                  : 'bg-oatmealDark text-charcoal/40';
                return `
                  <div class="relative flex gap-3.5">
                    ${!isLast ? `<div class="absolute left-[11px] top-6 bottom-[-16px] w-[2px] ${st.state === 'done' ? 'bg-forest' : 'bg-oatmealDark'}"></div>` : ''}
                    <div class="w-6 h-6 rounded-full ${dotStyle} flex items-center justify-center text-[11px] font-bold shrink-0 z-10 mt-0.5">
                      ${st.state === 'done' ? '✓' : idx + 1}
                    </div>
                    <div class="flex-1 pb-1">
                      <div class="flex items-center justify-between">
                        <span class="text-[13px] font-bold ${st.state === 'pending' ? 'text-charcoal/50' : 'text-charcoal'}">${st.title}</span>
                        <span class="text-[10px] font-semibold ${st.state === 'current' ? 'text-terracotta' : 'text-charcoal/45'}">${st.date}</span>
                      </div>
                      <p class="mt-0.5 text-[11px] leading-relaxed ${st.state === 'pending' ? 'text-charcoal/40' : 'text-charcoal/70'}">${st.desc}</p>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function switchTrackingOrder(type) {
      appState.selectedTrackingOrder = type;
      renderMyLoop();
    }

    // =========================================================================
    // 7. 화면 4: 마이페이지 (04_My)
    // =========================================================================
    function renderMyPage() {
      const viewport = document.getElementById('app-viewport');
      viewport.innerHTML = `
        <div class="animate-screen px-5 pt-3 pb-6 space-y-5">
          <div class="flex items-center gap-3.5 p-4 rounded-3xl bg-white border border-forest/10">
            <div class="w-14 h-14 rounded-full bg-forest text-oatmeal font-serif text-xl font-bold flex items-center justify-center">
              RB
            </div>
            <div>
              <div class="text-[16px] font-bold text-charcoal">김서연 님</div>
              <div class="text-[12px] text-charcoal/60">서울시 서대문구 연희맛로 · 기본 수거지 등록됨</div>
            </div>
          </div>

          <!-- 업사이클링 환경 임팩트 리포트 -->
          <div class="p-4 rounded-3xl bg-forest text-oatmeal">
            <div class="text-[11px] text-mustard font-semibold mb-2">MY UPCYCLING IMPACT</div>
            <div class="grid grid-cols-2 gap-3">
              <div class="p-3 rounded-2xl bg-oatmeal/10">
                <div class="text-[11px] text-oatmeal/75">다시 피어난 섬유</div>
                <div class="text-[20px] font-bold mt-0.5">3.4 <span class="text-[12px] font-normal">kg</span></div>
              </div>
              <div class="p-3 rounded-2xl bg-oatmeal/10">
                <div class="text-[11px] text-oatmeal/75">탄소 저감 효과</div>
                <div class="text-[20px] font-bold text-mustard mt-0.5">11.2 <span class="text-[12px] font-normal">kgCO₂</span></div>
              </div>
            </div>
          </div>

          <!-- 메뉴 리스트 -->
          <div class="rounded-3xl bg-white border border-forest/10 divide-y divide-oatmealDark text-[13px] font-medium">
            <button onclick="showToast('수거지 및 배송지 관리 화면입니다.')" class="w-full px-4 py-3.5 flex items-center justify-between text-left hover:bg-oatmeal/50">
              <span>수거지 및 리턴백 관리</span>
              <span class="text-charcoal/40">›</span>
            </button>
            <button onclick="showToast('보유 중인 리메이크 10% 할인 쿠폰 1장이 있습니다.')" class="w-full px-4 py-3.5 flex items-center justify-between text-left hover:bg-oatmeal/50">
              <span>2차 리메이크 쿠폰함</span>
              <span class="text-terracotta font-bold">1장</span>
            </button>
            <button onclick="resetPrototype()" class="w-full px-4 py-3.5 flex items-center justify-between text-left text-terracotta font-semibold hover:bg-oatmeal/50">
              <span>프로토타입 상태 초기화</span>
              <span>↺</span>
            </button>
          </div>
        </div>
      `;
    }

    function resetPrototype() {
      appState.customCreatedOrder = null;
      appState.selectedTrackingOrder = 'sample';
      appState.createStep = 1;
      appState.heroSliderValue = 55;
      showToast('프로토타입이 초기 상태로 리셋되었습니다.');
      switchTab('home');
    }

    // =========================================================================
    // 8. QR 디지털 스토리 아카이브 모달 (수령인용 모바일 웹 뷰)
    // =========================================================================
    function openQRArchive(index) {
      const data = index === -1 && appState.customCreatedOrder
        ? appState.customCreatedOrder
        : sampleStories[index >= 0 ? index : 0];

      const modal = document.getElementById('qr-modal');
      const content = document.getElementById('qr-modal-content');

      content.innerHTML = `
        <div class="flex items-center justify-between pb-3 border-b border-forest/10">
          <div class="flex items-center gap-2">
            <span class="px-2 py-0.5 rounded bg-forest text-oatmeal text-[10px] font-bold">QR ARCHIVE</span>
            <span class="text-[11px] font-mono text-charcoal/60">${data.id}</span>
          </div>
          <button onclick="closeQRArchive()" class="w-8 h-8 rounded-full bg-oatmealDark flex items-center justify-center text-charcoal font-bold">✕</button>
        </div>

        <div class="mt-4">
          <span class="text-[11px] font-bold text-terracotta">${data.shape} · ${data.date}</span>
          <h2 class="text-[19px] font-bold text-forest leading-snug mt-0.5">${data.title}</h2>

          <!-- 완성 화환 비주얼 -->
          <div class="mt-3 h-[160px] rounded-2xl overflow-hidden border border-forest/10">
            ${getWreathSVG(data.flowerType)}
          </div>

          <!-- 리본 문구 재현 -->
          <div class="mt-3 p-3.5 rounded-2xl bg-forest text-oatmeal flex items-center justify-between gap-3">
            <div>
              <div class="text-[10px] text-mustard font-semibold">RIBBON MESSAGE</div>
              <div class="font-batang text-[14px] font-bold mt-0.5">${data.ribbonMsg}</div>
              <div class="text-[11px] text-oatmeal/70 mt-0.5">— ${data.ribbonSender}</div>
            </div>
          </div>

          <!-- 물건의 서사 (Story) -->
          <div class="mt-3 p-4 rounded-2xl bg-white border border-forest/10">
            <div class="text-[11px] font-bold text-forest mb-1.5">이 꽃이 되기 전의 이야기</div>
            <p class="font-batang text-[13px] text-charcoal leading-relaxed">${data.story}</p>
            <div class="mt-3 pt-2.5 border-t border-oatmealDark">
              <div class="text-[11px] text-charcoal/60 mb-1">원물 및 보존된 디테일</div>
              <div class="flex flex-wrap gap-1.5">
                <span class="text-[11px] px-2 py-0.5 rounded-md bg-oatmeal text-charcoal font-semibold">${data.garments}</span>
                ${data.details.map(d => `<span class="text-[11px] px-2 py-0.5 rounded-md bg-forest/10 text-forest font-semibold">${d}</span>`).join('')}
              </div>
            </div>
          </div>

          <!-- 순환 안내 -->
          <div class="mt-3 p-3 rounded-xl bg-mustard/20 text-[11px] text-charcoal flex items-center justify-between">
            <span><strong>행사 후 계획:</strong> ${data.remake}</span>
          </div>
        </div>
      `;

      modal.classList.remove('hidden');
    }

    function closeQRArchive() {
      document.getElementById('qr-modal').classList.add('hidden');
    }

    // 배경 클릭 시 모달 닫기
    document.getElementById('qr-modal').addEventListener('click', (e) => {
      if (e.target.id === 'qr-modal') closeQRArchive();
    });

    // 앱 초기화 실행
    window.onload = function () {
      switchTab('home');
    };
  </script>
</body>
</html>
